<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Daniel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">

        <div class="info-box">
            <img src="image.jpg" alt="">

            <div class="info">
                <h2>Daniel J. Holibryan</h2>
                <p>Web Developer</p>
            </div>
        </div>   

        <div class="numbers-grid">
            
            <div class="box">
                <p>87</p>
                <p>Posts</p>
            </div>

            <div class="box">
                <p>61k</p>
                <p>Followers</p>
            </div>

            <div class="box">
                <p>13</p>
                <p>Following</p>
            </div>

        </div>

        <div class="btn-box">
            <button class="Follow">Follow</button>
            <button class="message">Message</button>
        </div>

    </div>    
</body>
</html>
